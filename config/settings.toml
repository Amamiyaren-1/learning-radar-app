# Configuration guidance: see README and DEVELOPER-GUIDE.md.
# Request budgets include underlying failures and share the task-wide hard cap.

[app]
timezone = "Asia/Shanghai"
data_dir = "data"
user_agent = "learning-radar/0.1 (+personal learning assistant; local use only)"

# Model roles and provider parameters are configuration-driven.
# Configuration guidance: see README and DEVELOPER-GUIDE.md.
[models]
screening = "flash"  # Configured screening role.
analysis = "pro"  # Configured analysis role.

# Configuration guidance: see README and DEVELOPER-GUIDE.md.
[[models.candidate]]
name = "flash"
label = "V4.1 Flash（初筛）"
provider = "chat_completions"
model_id = "deepseek-flash"  # See DEVELOPER-GUIDE.md for this setting; runtime value unchanged.
base_url = "https://api.deepseek.com/v1"
api_key_env = "LEARNRADAR_FALLBACK_API_KEY"
reasoning_effort = ""  # Provider-specific reasoning setting.
temperature = 0.2
max_output_tokens = 4000  # Configured output limit; provider limits may differ.
timeout_seconds = 180
probe_completion = false
follow_redirects = false  # Do not forward credentials/profile bodies to redirected endpoints.
pricing_input_per_mtok = 0.0
pricing_output_per_mtok = 0.0
pricing_currency = "USD"

# Configuration guidance: see README and DEVELOPER-GUIDE.md.
[[models.candidate]]
name = "pro"
label = "V4 Pro（分析）"
provider = "chat_completions"
model_id = "deepseek-v4-pro"  # See DEVELOPER-GUIDE.md for this setting; runtime value unchanged.
base_url = "https://api.deepseek.com/v1"
api_key_env = "LEARNRADAR_FALLBACK_API_KEY"
reasoning_effort = "low"  # Provider-specific reasoning setting.
temperature = 0.2
max_output_tokens = 16000  # Configured output limit; provider limits may differ.
timeout_seconds = 300
probe_completion = false
follow_redirects = false
pricing_input_per_mtok = 0.0
pricing_output_per_mtok = 0.0
pricing_currency = "USD"

# Explicit offline fixture for tests, not a real integration.
[[models.candidate]]
name = "offline"
label = "离线夹具（测试用，非真实模型）"
provider = "offline_fixture"
model_id = "offline-fixture-v1"
base_url = ""
api_key_env = ""
reasoning_effort = ""
temperature = 0.0
max_output_tokens = 6000
timeout_seconds = 30
probe_completion = false
pricing_input_per_mtok = 0.0
pricing_output_per_mtok = 0.0
pricing_currency = "USD"

# Select by screening decision, then fit; recency breaks ties, never language.
# Select by screening decision, then fit; recency breaks ties, never language.
# Configuration guidance: see README and DEVELOPER-GUIDE.md.
[discovery]
directions_per_task = 3
candidates_per_direction = 10
merged_candidates = 30

[selection]
tiebreak_recent = true
# Cooldown uses original run/report state; rechecks and feedback do not alter it.
# Explicit offline fixture for tests, not a real integration.
cooldown_success_days = 30  # Published target cooldown.
cooldown_failure_days = 7  # Failed/rejected target cooldown.

# Weekly remains one configured topic; deployment requires separate acceptance.
# Configuration guidance: see README and DEVELOPER-GUIDE.md.
[schedule]
timezone = "Asia/Shanghai"
weekday = "Sun"
at = "20:17"
topic = "agent-memory"
task_timeout_seconds = 3600  # See DEVELOPER-GUIDE.md for this setting; runtime value unchanged.
attach_markdown = true  # See DEVELOPER-GUIDE.md for this setting; runtime value unchanged.

[limits]
discover_max_candidates = 30
# Request budgets include underlying failures and share the task-wide hard cap.
# Configuration guidance: see README and DEVELOPER-GUIDE.md.
screening_max_calls = 2
analysis_max_calls = 2
screening_max_candidates = 5  # See DEVELOPER-GUIDE.md for this setting; runtime value unchanged.
screening_max_keep = 8
# Configuration guidance: see README and DEVELOPER-GUIDE.md.
readme_head_chars = 500
readme_section_chars = 900
readme_max_sections = 4
readme_budget_chars = 3200
fetch_learning_entry = true  # See DEVELOPER-GUIDE.md for this setting; runtime value unchanged.
learning_entry_max_attempts = 3  # See DEVELOPER-GUIDE.md for this setting; runtime value unchanged.
example_file_max = 2  # See DEVELOPER-GUIDE.md for this setting; runtime value unchanged.
deep_analysis_max = 4
max_recommendations = 2
max_sources_per_candidate = 8
max_search_rounds = 2
max_model_calls_per_run = 4  # Hard task-wide request budget, including failures.
max_evidence_bytes = 400000
min_comparators = 2

[http]
timeout_seconds = 30
max_retries = 2
max_response_bytes = 2000000
