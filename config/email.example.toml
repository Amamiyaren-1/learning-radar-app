subject_prefix = "[Learning Radar]"
username = "learning-radar@example.com"  # See DEVELOPER-GUIDE.md for this setting; runtime value unchanged.
password_env = "LEARNRADAR_SMTP_PASSWORD"
timeout_seconds = 30
attach_markdown = true  # See DEVELOPER-GUIDE.md for this setting; runtime value unchanged.
