[email]
host = "smtp.example.com"  # See DEVELOPER-GUIDE.md for this setting; runtime value unchanged.
port = 587  # See DEVELOPER-GUIDE.md for this setting; runtime value unchanged.
security = "starttls"               # starttls | ssl
sender = "learning-radar@example.com"
